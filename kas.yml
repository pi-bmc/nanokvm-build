# kas configuration for NanoKVM Yocto build
# Usage: kas build kas.yml
# Install kas: pip3 install kas

header:
  version: 14

machine: sg2002-licheervnano
distro: nanokvm
target: nanokvm-image

build_system: openembedded

repos:
  # meta-yocto-bsp (qemu/x86/beaglebone BSPs) is intentionally absent; meta-poky
  # stays because the rpi multiconfig uses DISTRO = "poky".
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  # meta-oe: haveged, jansson (nftables dep). meta-networking: nftables,
  # libnftnl, wireguard-tools. meta-python ships nothing into the image
  # but is a hard LAYERDEPENDS of meta-networking. meta-filesystems was only
  # needed for exfatprogs, gone with the exfat /data partition.
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-networking:
      meta-python:

  # meta-riscv is intentionally absent: oe-core provides the riscv64 tune
  # (conf/machine/include/riscv/tune-riscv.inc) and every meta-riscv bbappend
  # is gated on other machines (jh7110/milkv-duo/ae350) or riscv32. The two
  # QA waivers it carried that DO apply here (eudev/util-linux textrel on
  # riscv64) moved into meta-nanokvm's distro conf.

  # Local layers (inside this repo, no git fetch needed)
  meta-sophgo:
    path: meta-sophgo
    layers:
      .:

  meta-nanokvm:
    path: meta-nanokvm
    layers:
      .:

  # Raspberry Pi boot-image layer, vendored into this repo. Builds (under the
  # "rpi" multiconfig, see meta-nanokvm/conf/multiconfig/rpi.conf) the
  # aarch64 U-Boot + TF-A + RPi firmware GPT image that the NanoKVM's USB
  # mass-storage gadget serves to the managed Pi. Copied from
  # bmcpi/firmware-images yocto/meta-pibmc with its ../u-boot patch/overlay/
  # config sources dereferenced in place, so it is fully self-contained (no
  # external checkout needed). Re-sync from upstream if those patches change.
  meta-raspberrypi:
    path: meta-raspberrypi
    layers:
      .:

local_conf_header:
  nanokvm: |
    # NanoKVM build configuration
    MACHINE = "sg2002-licheervnano"
    DISTRO = "nanokvm"
    # Use musl libc to match the original Buildroot build
    TCLIBC = "musl"
    # Parallel build tuning
    BB_NUMBER_THREADS = "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE = "-j ${@oe.utils.cpu_count()}"
    # Disable interactive prompts
    CONNECTIVITY_CHECK_URIS = ""
    # AUTOREV recipes (nanokvm-server) must track the current upstream HEAD.
    # The default srcrev cache pins the first-resolved commit, so builds go
    # stale; "clear" re-resolves SRCREV every build so AUTOREV always pulls the
    # newest (pinned SRCREV recipes are unaffected -- they need no resolution).
    BB_SRCREV_POLICY = "clear"
    # Second multiconfig that builds the Raspberry Pi boot image (aarch64/poky)
    # alongside this riscv64/musl one. conf/multiconfig/rpi.conf (in
    # meta-nanokvm) sets its MACHINE/DISTRO/TCLIBC/TMPDIR; nanokvm-image pulls
    # its output in via rpi-firmware-seed's do_install[mcdepends]. The default
    # (this) config need not be listed here.
    BBMULTICONFIG = "rpi"
    # Shared download and sstate directories (can be overridden per user)
    DL_DIR = "/opt/yocto/downloads"
    SSTATE_DIR = "/opt/yocto/sstate-cache"
