# NanoKVM kernel delta over the mainline riscv `defconfig`.
#
# Two jobs:
#   1. cut the Image down to fit U-Boot's stock kernel staging window;
#   2. enable the drivers the BMC userspace needs.
#
# The size target comes from the stock licheerv_nano.h environment:
#     kernel_addr_r = 0x81000000
#     fdt_addr_r    = 0x82000000
# U-Boot loads the raw Image at kernel_addr_r, so it must not reach fdt_addr_r:
# a hard 16 MiB ceiling. booti then relocates it down to 0x80200000, and the
# running kernel's _end (the Image header's image_size = text+data+bss) must
# also stay below fdt_addr_r -- so the real cap is on image_size, not just the
# file size. Target <= 14 MiB for margin.
#
# Measured baseline (defconfig + the previous fragment): Image = 28.15 MiB, of
# which .text 12.19, 2 MiB section padding 8.80, .rodata 3.74, .data 2.03.

# =====================================================================
# Version string
# =====================================================================

# LOCALVERSION_AUTO defaults to y (init/Kconfig), so scripts/setlocalversion
# runs git describe against ${S}. That tree always has the DTS backports applied
# on top of the v6.18.38 tag, so every build came out as "6.18.38-dirty" -- and
# would become "6.18.38-g<sha>" the moment SRCREV moves off a tag. The kernel
# release lands in /lib/modules/<rel> and in `uname -r`, which the BMC reports.
#
# Passing LOCALVERSION_AUTO=n to make does nothing: setlocalversion greps
# CONFIG_LOCALVERSION_AUTO out of include/config/auto.conf. It has to be a
# kconfig n, so it lives here.
#
# CONFIG_LOCALVERSION is already "" by default; pinned explicitly so the
# bbappend's post-merge check guards it. Note LINUX_VERSION_EXTENSION in the
# base recipe does NOT feed this -- only kernel-yocto.bbclass consumes that, and
# linux-sophgo inherits plain `kernel`.
# CONFIG_LOCALVERSION_AUTO is not set
CONFIG_LOCALVERSION_AUTO=n
CONFIG_LOCALVERSION=""

# =====================================================================
# Size: layout and codegen
# =====================================================================

# The single biggest lever. On RISC-V, STRICT_KERNEL_RWX sets SECTION_ALIGN to
# 2 MiB (arch/riscv/include/asm/set_memory.h); without it SECTION_ALIGN is
# L1_CACHE_BYTES. The five 2 MiB boundaries between .text/.init/.rodata/
# .srodata/.data cost 8.80 MiB of pure padding -- a ~12 MiB floor before a
# single byte of driver code, which cannot fit the 16 MiB window. Turning it
# off costs kernel W^X (.text stays writable-mapped); acceptable here because
# this is a single-purpose appliance whose only userspace is the root-run BMC.
# CONFIG_STRICT_KERNEL_RWX is not set

# -Os over -O2. Worth ~10-15% of .text; nothing here is throughput-sensitive
# (the C906 is a single-issue in-order core).
# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set
CONFIG_CC_OPTIMIZE_FOR_SIZE=y

# Modules are back on. They were off because "no out-of-tree modules remain
# (the cvitek osdrv stack is gone)" -- that is no longer true: local HDMI
# capture on the SG2002 needs the CVITek pipeline (soph_ion, soph_base,
# soph_sys, soph_mipi_rx, soph_vi, soph_vpss, soph_vcodec, cvi_vc_drv), and
# none of it exists in mainline. See meta-sophgo/recipes-kernel/soph-*.
#
# The cost is what turning it off bought: the module loader in .text, the
# __ksymtab/__ksymtab_gpl/__ksymtab_strings sections (0.50 MiB) in the Image,
# and a modules tarball in the rootfs. That is the price of the capture path;
# the alternative is no local video at all.
#
# NB: the "=m" subtrees disabled explicitly further down MUST stay explicit.
# With MODULES on, kconfig may now honour "=m" rather than dropping it, so a
# symbol left unset is free to come back as a module and grow the rootfs. The
# explicit "is not set" lines below are what keep that from happening.
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y

# ION, restored in-tree by 0009 (see the bbappend). CVITEK selects
# CARVEOUT_HEAP, which is the one the board actually uses: the heap is the
# reserved-memory region at CVIMMAP_ION_ADDR (0x89500000, 105 MiB) from
# meta-sophgo's cvi_board_memmap.h, described in the board DTS.
#
# SYSTEM_HEAP/CMA_HEAP stay off deliberately. The pipeline allocates only from
# the carveout, and ION_CMA_HEAP would additionally pull in DMA_CMA.
#
# STAGING is the gate, not a feature: drivers/staging/Kconfig wraps everything
# in "if STAGING", and 0009 sources the restored android/ion Kconfig from
# inside it, so with STAGING off every ION symbol below is invisible and
# kconfig silently drops it (which is exactly what the do_configure check
# further down catches). Turning it on costs nothing on its own -- every other
# staging driver defaults to n and none are enabled here.
CONFIG_STAGING=y
CONFIG_ION=y
CONFIG_ION_CVITEK=y
CONFIG_ION_CARVEOUT_HEAP=y
# CONFIG_ION_SYSTEM_HEAP is not set
# CONFIG_ION_CHUNK_HEAP is not set
# CONFIG_ION_CMA_HEAP is not set

# =====================================================================
# Size: subsystems this board physically does not have
# =====================================================================

# No PCIe on the SG2002. Also the root of the GPU stack: nouveau.ko (5.1 MiB)
# and radeon.ko (4.4 MiB) were being built and shipped for a headless BMC.
# CONFIG_PCI is not set

# No SATA/SCSI/RAID, and no USB host to hang usb-storage off. The mass-storage
# *gadget* (USB_F_MASS_STORAGE) parses SCSI commands itself and needs none of
# this.
# CONFIG_SCSI is not set
# CONFIG_ATA is not set
# CONFIG_MD is not set

# Headless output: no audio codec, no display controller.
# CONFIG_SOUND is not set
# CONFIG_DRM is not set
# CONFIG_FB is not set

# --- V4L2 / Media Controller core, all as modules ---
# The capture stack is back: soph-media carries the ported vendor VI/VPSS/
# VENC drivers, and its soph_v4l2 front-end exposes them as a standard
# media-controller graph (/dev/media0, /dev/v4l-subdev*, /dev/video0). That
# module links against videodev/mc/videobuf2, so the V4L2 core has to exist
# -- but only as modules in the rootfs, where the 14 MiB Image budget cannot
# see it.
#
# VIDEO_VIMC is not used at runtime. It is the anchor that makes kconfig
# emit the promptless selected-only symbols an out-of-tree V4L2 driver
# cannot request itself: VIDEO_V4L2_SUBDEV_API, VIDEOBUF2_VMALLOC (and
# MEDIA_CONTROLLER, which is also set explicitly below). Nothing in-tree
# would otherwise select them, and a config fragment cannot set a symbol
# that has no prompt.
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_TEST_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=m
CONFIG_V4L_TEST_DRIVERS=y
CONFIG_VIDEO_VIMC=m

# No radio of any kind: the SDIO1 pads are I2C1 now (see the board DTS patch).
# CONFIG_WLAN is not set
# CONFIG_WIRELESS is not set
# CONFIG_BT is not set

# =====================================================================
# Size: kernel features an appliance never uses
# =====================================================================

# CONFIG_VIRTUALIZATION is not set
# CONFIG_COMPAT is not set

# EFI is unreachable here (FSBL -> OpenSBI -> U-Boot -> booti; nothing ever
# enters via UEFI), but "# CONFIG_EFI is not set" alone does nothing: `config
# PORTABLE` is `default !NONPORTABLE` and does `select EFI`, and a select beats
# an explicit n. Declaring the kernel non-portable -- true, it targets exactly
# one SoC -- lets the EFI stub, runtime wrappers and efivarfs actually go away.
CONFIG_NONPORTABLE=y
# CONFIG_EFI is not set
# CONFIG_KEXEC is not set
# CONFIG_KEXEC_FILE is not set
# CONFIG_CRASH_DUMP is not set
# CONFIG_HIBERNATION is not set
# CONFIG_SUSPEND is not set
# CONFIG_IKCONFIG is not set

# Tracing and instrumentation. FTRACE in particular pays per-function call
# overhead throughout .text.
# CONFIG_FTRACE is not set
# CONFIG_FUNCTION_TRACER is not set
# CONFIG_PROFILING is not set
# CONFIG_PERF_EVENTS is not set
# CONFIG_KPROBES is not set
# CONFIG_DEBUG_KERNEL is not set
# CONFIG_DEBUG_MISC is not set
# CONFIG_DEBUG_INFO is not set

# No BPF consumer in the image (no tc, no systemd).
# CONFIG_BPF_SYSCALL is not set
# CONFIG_BPF_JIT is not set

# Audit and the built-but-never-enabled LSMs. The riscv defconfig builds
# SELinux and AppArmor, but neither appears in CONFIG_LSM's boot list, so
# they can never initialize -- ~370 KiB of dead .text. AppArmor's
# `select AUDIT` is also the only thing dragging in audit (and its kauditd
# kthread); no audit userspace exists. A select beats an explicit n, so all
# three must go together (same pattern as EFI above).
# CONFIG_SECURITY_SELINUX is not set
# CONFIG_SECURITY_APPARMOR is not set
# CONFIG_AUDIT is not set

# KALLSYMS stays: oops backtraces on a headless board are worth ~200 KiB.
CONFIG_KALLSYMS=y
# CONFIG_KALLSYMS_ALL is not set

# =====================================================================
# Size: networking and filesystems the image never uses
# =====================================================================

# CONFIG_NET_SCHED is not set
# CONFIG_IP_SET is not set
# CONFIG_BRIDGE is not set
# CONFIG_INFINIBAND is not set

# The rootfs is ext4, /boot is vfat, /data is exfat; squashfs+overlayfs stay.
# CONFIG_BTRFS_FS is not set
# CONFIG_XFS_FS is not set
# CONFIG_F2FS_FS is not set
# CONFIG_JFS_FS is not set
# CONFIG_NFS_FS is not set
# CONFIG_NFSD is not set
# CONFIG_CIFS is not set

# =====================================================================
# Keep: storage, console, pinmux, buses
# =====================================================================
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_OF_DWCMSHC=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_SOPHGO_CV1800B=y
CONFIG_PINCTRL_SOPHGO_SG2002=y
CONFIG_GPIO_DWAPB=y

# No SPI and no watchdog. Both are absent from the *device tree*, not just from
# this fragment:
#   * cv180x.dtsi declares spi0..spi3 but the LicheeRV Nano board DTS enables
#     none of them, so the DesignWare SPI driver never probes and /dev/spidev*
#     never appears. (The spidev-test package is dropped from the image with it;
#     re-enabling means adding a `&spi0 { status = "okay"; }` to the board DTS
#     plus CONFIG_SPI_DESIGNWARE / SPI_DW_MMIO / SPI_SPIDEV here.)
#   * mainline sophgo DTS has no watchdog node at all, so CONFIG_DW_WATCHDOG has
#     nothing to bind and /dev/watchdog never exists. The `watchdog` daemon that
#     used to run at rc5.d/S25watchdog was therefore failing on every boot; it is
#     dropped from the image too. Restoring it needs a wdt node in the DTS first.
#
# Note the *real* kconfig symbol is SPI_DESIGNWARE, not SPI_DW. Asking for a
# non-existent symbol is silent -- see the verification step in the bbappend.
#
# With no wdt node, CONFIG_WATCHDOG=y (defconfig) buys nothing yet still
# spawns the watchdogd kthread from the watchdog core and builds other
# vendors' wdt drivers (sunxi, starfive). Off until the DTS grows a node.
# CONFIG_WATCHDOG is not set

# Filesystems used by the SD image.
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
# The root filesystem is a squashfs-zst image (rootfs slot A/B on p2/p3) that
# the initramfs overlays with a volatile tmpfs upper; the initramfs itself is
# a gzip cpio loaded via extlinux INITRD.
CONFIG_SQUASHFS_ZSTD=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y
CONFIG_EXFAT_FS=y
CONFIG_CONFIGFS_FS=y
CONFIG_DEBUG_FS=y

# --- USB gadget (dwc2 behind sophgo,cv1800b-usb) ---
# The board DTS pins dr_mode = "peripheral", so build the peripheral-only dwc2
# and leave the entire USB *host* stack (usbcore, xhci/ehci/ohci) out. dwc2
# depends on (USB || USB_GADGET); USB_GADGET alone satisfies it.
# CONFIG_USB is not set
CONFIG_USB_SUPPORT=y
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_PERIPHERAL=y
# CONFIG_USB_DWC2_DUAL_ROLE is not set
# USB2 PHY for the SG2002 dwc2 controller. Without it dwc2 defers forever
# ("dwc2: error getting phy") and no UDC appears, so the gadget never binds.
# The PHY driver reads the top-syscon regmap (the usb2-phy DT node is a child of
# syscon@3000000, backported in 0002-...-usb2-phy.patch), hence MFD_SYSCON.
CONFIG_MFD_SYSCON=y
CONFIG_PHY_SOPHGO_CV1800_USB2=y
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ACM=y
# No USB_CONFIGFS_F_UVC. It depends on VIDEO_DEV, which depends on
# MEDIA_SUPPORT, so keeping it would drag the whole V4L2 core back in -- and
# nothing uses it: S03usbdev creates no uvc function and the server never
# touches one (the closed VI/VPSS/VENC capture stack that fed it is gone).
# The uvc-gadget package is dropped from the image for the same reason.

# HID *core* is not needed: f_hid (USB_CONFIGFS_F_HID) is a gadget function and
# does not consume the HID bus. evdev is, for evtest / input-event-daemon.
# CONFIG_HID_SUPPORT is not set
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y

# --- I2C slave EEPROM presented to the managed host ---
# i2c1 (SD1 pads) uses the DesignWare controller in slave mode; the eeprom is
# declared in the board DTS (eeprom@50 with the I2C_OWN_SLAVE_ADDRESS flag),
# which both triggers slave-mode probe and binds i2c-slave-eeprom. Nothing in
# userspace instantiates it -- see the deleted i2c-eeprom recipe.
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_SLAVE=y
CONFIG_I2C_SLAVE_EEPROM=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_DESIGNWARE_SLAVE=y

# --- Reboot: CV1800/SG2002 RTC/PoR restart handler (0005 patch) ---
# Built-in so the warm-reset restart handler registers early; without it Linux
# reboot hangs (no SBI SRST reset device, no DT reboot node). Pulls in the RTC.
CONFIG_SOPHGO_CV1800_RTCSYS=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_CV1800=y

# --- zram swap (recipes-core/zram-swap) ---
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_LZO=y
CONFIG_ZSMALLOC=y

# --- Firewall / VPN userspace (nftables, wireguard-tools) ---
# NF_NAT depends on NF_CONNTRACK, which defconfig had at "=m". With MODULES off
# it must be "=y" explicitly or nftables NAT silently disappears.
#
# NFT_NAT additionally "depends on NF_TABLES_IPV4 || NF_TABLES_IPV6". Neither is
# in the mainline defconfig, so without them NFT_NAT is not even a visible
# symbol and the request for it is dropped without a word.
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
# NF_TABLES_INET backs the "table inet" family. The NanoKVM server's network
# service (server/service/network/isolation.go) installs an `inet` forward-drop
# guard on usb0 so the host link can never be routed even when ip_forward is
# globally on for WireGuard; without this symbol that nft load silently fails
# and the guard is a no-op. Cheap -- the v4/v6 tables it selects are already on.
CONFIG_NF_TABLES_INET=y
CONFIG_NF_NAT=y
CONFIG_NFT_NAT=y
CONFIG_WIREGUARD=y

# --- Ethernet: SG2002 gmac0 (dwmac) + internal 10/100 EPHY ---
# The board DTS enables &gmac0 and &mdio; the internal EPHY hangs off an
# mdio-mux-mmioreg, so MDIO_BUS_MUX_MMIOREG is mandatory (mainline defconfig
# leaves it off) or the PHY is never found and eth0 never appears. Built-in so
# the interface is up early for the BMC network. U-Boot's ft_board_setup()
# writes local-mac-address into the DT, so stmmac gets a stable MAC with no
# in-kernel eFUSE driver and no userspace hook.
#
# DWMAC_GENERIC is what actually binds this MAC, and it must be =y. The node is
# compatible = "sophgo,cv1800b-dwmac", "snps,dwmac-3.70a", and cv1800b has a
# devicetree *binding* but no driver -- dwmac-sophgo.c matches only sg2042 and
# sg2044 -- so the board is meant to bind through the fallback, which is
# dwmac-generic.c. Its Kconfig `default STMMAC_PLATFORM` does not help: the riscv
# defconfig already sets DWMAC_GENERIC=m explicitly and an explicit value beats a
# default, so raising STMMAC_PLATFORM here leaves it a module. Nothing loads
# modules on this image, so stmmac never probed at all: no MDIO bus was
# registered, mdio-mux-mmioreg deferred forever on its missing mdio-parent-bus
# ("failed to register mdio-mux bus /soc/mdio-mux@3009800"), the PHY was never
# found and eth0 never appeared. Do not drop this back to =m.
#
# MDIO_BUS_MUX_MMIOREG is likewise mandatory (mainline defconfig leaves it off):
# the internal EPHY hangs off an mdio-mux (cv180x.dtsi's mdio-mux@3009800).
#
# No in-kernel PHY driver: upstream declares internal_ephy as a plain
# "ethernet-phy-ieee802.3-c22", U-Boot's board_init() runs the vendor bring-up
# (cv1800b_ephy_init) and writes MII_PHYSID1/2, and phylib then reads a real id
# and binds genphy. That is the upstream arrangement milkv_duo uses. U-Boot's
# ft_board_setup() also writes local-mac-address into the DT, so stmmac gets a
# stable MAC with no in-kernel eFUSE driver and no userspace hook.
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_GENERIC=y
CONFIG_MDIO_BUS_MUX=y
CONFIG_MDIO_BUS_MUX_MMIOREG=y
