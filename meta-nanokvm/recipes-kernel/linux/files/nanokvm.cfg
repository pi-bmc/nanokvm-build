# NanoKVM feature delta over the mainline riscv `defconfig`.
#
# STARTER fragment: enables the drivers the BMC userspace in nanokvm-image.bb
# relies on. Verify/trim after the first build (merge_config.sh warns on any
# symbol whose deps the mainline defconfig doesn't satisfy).

# --- USB dual-role / gadget (dwc2 behind sophgo,cv1800b-usb) ---
# The USB DTS backport enables the controller in "host" mode; the NanoKVM BMC
# role (HID keyboard/mouse, mass-storage, RNDIS to the managed machine) needs
# peripheral/OTG. Enable the gadget stack here; set dr_mode via the DTS.
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_DUAL_ROLE=y
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_F_UVC=y

# --- I2C slave EEPROM presented to the managed host (recipes-core/i2c-eeprom) ---
# i2c1 (SD1 pads) uses the DesignWare controller in slave mode; the backend is
# instantiated at runtime via sysfs new_device.
CONFIG_I2C_SLAVE=y
CONFIG_I2C_SLAVE_EEPROM=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_DESIGNWARE_SLAVE=y

# --- zram swap (recipes-core/zram-swap) ---
CONFIG_ZRAM=y
CONFIG_ZSMALLOC=y

# --- Filesystems used by the SD image ---
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_EXFAT_FS=y

# --- Firewall / VPN userspace (nftables, wireguard-tools) ---
CONFIG_NF_TABLES=y
CONFIG_NF_NAT=y
CONFIG_NFT_NAT=y
CONFIG_WIREGUARD=y
