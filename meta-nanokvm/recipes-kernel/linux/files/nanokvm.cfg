# NanoKVM feature delta over the mainline riscv `defconfig`.
#
# STARTER fragment: enables the drivers the BMC userspace in nanokvm-image.bb
# relies on. Verify/trim after the first build (merge_config.sh warns on any
# symbol whose deps the mainline defconfig doesn't satisfy).

# --- USB dual-role / gadget (dwc2 behind sophgo,cv1800b-usb) ---
# The USB DTS backport enables the controller in "host" mode; the NanoKVM BMC
# role (HID keyboard/mouse, mass-storage, RNDIS to the managed machine) needs
# peripheral/OTG. Enable the gadget stack here; set dr_mode via the DTS.
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_DUAL_ROLE=y
# USB2 PHY for the SG2002 dwc2 controller. Without it dwc2 defers forever
# ("dwc2: error getting phy") and no UDC appears, so the gadget never binds.
# The PHY driver reads the top-syscon regmap (the usb2-phy DT node is a child of
# syscon@3000000, backported in 0002-...-usb2-phy.patch), hence MFD_SYSCON.
CONFIG_MFD_SYSCON=y
CONFIG_PHY_SOPHGO_CV1800_USB2=y
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_F_UVC=y

# --- I2C slave EEPROM presented to the managed host (recipes-core/i2c-eeprom) ---
# i2c1 (SD1 pads) uses the DesignWare controller in slave mode; the eeprom is
# declared in the board DTS (eeprom@50 with the I2C_OWN_SLAVE_ADDRESS flag),
# which both triggers slave-mode probe and binds i2c-slave-eeprom.
CONFIG_I2C_SLAVE=y
CONFIG_I2C_SLAVE_EEPROM=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_DESIGNWARE_SLAVE=y

# --- Reboot: CV1800/SG2002 RTC/PoR restart handler (0005 patch) ---
# Built-in so the warm-reset restart handler registers early; without it Linux
# reboot hangs (no SBI SRST reset device, no DT reboot node). Pulls in the RTC.
CONFIG_SOPHGO_CV1800_RTCSYS=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_CV1800=y

# --- zram swap (recipes-core/zram-swap) ---
CONFIG_ZRAM=y
CONFIG_ZSMALLOC=y

# --- Filesystems used by the SD image ---
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_EXFAT_FS=y

# --- Firewall / VPN userspace (nftables, wireguard-tools) ---
CONFIG_NF_TABLES=y
CONFIG_NF_NAT=y
CONFIG_NFT_NAT=y
CONFIG_WIREGUARD=y

# --- Ethernet: SG2002 gmac0 (dwmac) + internal 10/100 EPHY ---
# The board DTS enables &gmac0 and &mdio; the internal EPHY hangs off an
# mdio-mux-mmioreg, so MDIO_BUS_MUX_MMIOREG is mandatory (mainline defconfig
# leaves it off) or the PHY is never found and eth0 never appears. Built-in so
# the interface is up early for the BMC network.
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_SOPHGO=y
CONFIG_MDIO_BUS_MUX=y
CONFIG_MDIO_BUS_MUX_MMIOREG=y
# Internal EPHY analog RX bring-up at phylib config_init (0004 patch). Without a
# dedicated driver the internal PHY binds Generic PHY, the 100BASE-TX receive
# equalizer is never tuned from Linux, and RX stays dead (mmc_rx=0) even though
# the link trains. Built-in so it is present before the MAC brings eth0 up.
CONFIG_CVITEK_PHY=y

# --- eFUSE (0006 patch): read-only nvmem provider for the chip fuses ---
# Neither mainline U-Boot nor stmmac provides a MAC for gmac0, so the kernel
# synthesises a fresh random locally-administered ("private") MAC on every boot
# and the DHCP lease cycles. Expose the eFUSE shadow as nvmem so userspace
# (nanokvm-eth) can derive a stable per-chip MAC. NVMEM/NVMEM_SYSFS are already
# enabled by the riscv defconfig; this just adds the provider. Built-in so the
# nvmem device exists before eth0 is brought up.
CONFIG_NVMEM_SOPHGO_CV1800=y
