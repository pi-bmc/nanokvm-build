# Multiconfig for the Raspberry Pi boot image (the vendored meta-raspberrypi layer).
#
# Selected by BBMULTICONFIG = "rpi" (kas.yml). This file is layered on top of
# the shared build/conf/local.conf, so it must undo the NanoKVM-specific choices
# there: a different machine, a different distro, and glibc instead of musl.
# DL_DIR / SSTATE_DIR / thread counts are inherited from local.conf and stay
# shared, which is what we want.
#
# The artifact this produces --
#   ${TMPDIR}/deploy/images/rpi64/rpi-uboot-image-rpi64.rootfs.wic.xz
# -- is consumed by meta-nanokvm's rpi-firmware-seed recipe (in the default
# multiconfig) via do_install[mcdepends]. If you change TMPDIR here, update the
# path in that recipe to match.

MACHINE = "rpi64"
DISTRO = "poky"

# local.conf pins TCLIBC = "musl" for the whole build; the Pi image is a stock
# glibc/poky target, so put it back.
TCLIBC = "glibc"

# Keep the two toolchains' outputs completely separate. Only DEPLOY artifacts
# are shared across the multiconfig boundary, and those are per-MACHINE
# subdirectories, so there is no collision.
TMPDIR = "${TOPDIR}/tmp-rpi"

# Component versions. These mirror firmware-images/u-boot/version, which the
# standalone rpi kas project feeds in via env passthrough; here the recipes'
# ?= defaults are overridden directly.
#
# NOTE: RPI_FIRMWARE_REF and LINUX_RPI_REF are BRANCH names -- their GitHub
# archive tarballs are cached in DL_DIR by name and are NOT reproducible. Pin
# them to a tag or sha for a reproducible image.
UBOOT_REF = "v2026.07"
TFA_REF = "v2.15.0"
RPI_FIRMWARE_REF = "master"
LINUX_RPI_REF = "rpi-6.18.y"
TALOS_KERNEL_TAG = "v1.13.0-36-g6b315f7"

# The image stays wic.xz (the machine default). The trimmed NanoKVM rootfs has
# busybox zcat/gunzip but no unxz, so rpi-firmware-seed recompresses the .xz
# to .gz at build time -- setting IMAGE_FSTYPES here does not stick anyway, the
# machine conf's assignment parses after this one and wins.
