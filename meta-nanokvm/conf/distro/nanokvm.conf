DISTRO = "nanokvm"
DISTRO_NAME = "NanoKVM"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "licheervnano"

# musl libc (matches original Buildroot defconfig)
TCLIBC = "musl"

# Init system: SysV (matches original Buildroot sysvinit)
VIRTUAL-RUNTIME_init_manager = "sysvinit"
VIRTUAL-RUNTIME_initscripts = "initscripts"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"

DISTRO_FEATURES = "ext2 ipv4 ipv6 largefile usbgadget usbhost wifi nfs"

# Optimization: size over speed (matches CONFIG_CC_OPTIMIZE_FOR_SIZE=y)
FULL_OPTIMIZATION = "-Os -pipe"
DEBUG_BUILD ?= "0"

# Avoid locale data to keep rootfs small
IMAGE_LINGUAS = "en-us"

# Strip binaries
INHIBIT_PACKAGE_STRIP = "0"
PACKAGE_STRIP = "full"

# Use opkg for package management (lightweight, good for embedded)
PACKAGE_CLASSES = "package_ipk"

PREFERRED_PROVIDER_jpeg = "libjpeg-turbo"
PREFERRED_PROVIDER_virtual/libintl = "gettext"
