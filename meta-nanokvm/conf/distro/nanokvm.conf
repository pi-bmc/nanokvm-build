DISTRO = "nanokvm"
DISTRO_NAME = "NanoKVM"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "licheervnano"

# musl libc (matches BR2_TOOLCHAIN_EXTERNAL_CUSTOM_MUSL=y)
TCLIBC = "musl"

# Init system: busybox init (JetKVM-style), not the sysvinit package.
# The include is still used for the "sysvinit" DISTRO_FEATURE — that feature
# is what makes update-rc.d.bbclass generate the /etc/rcS.d & /etc/rc?.d
# symlinks our three service scripts (zram-swap, nanokvm-data, nanokvm) are
# registered through — but the ??= defaults below it are overridden so PID 1
# is busybox init:
#
#   busybox init      reads /etc/inittab (busybox-inittab, bbappended in
#                     recipes-core/busybox with this image's minimal version)
#                     and runs busybox's rcS/rcK runners, which walk
#                     /etc/rcS.d + /etc/rc5.d on boot and /etc/rc6.d on
#                     shutdown. So update-rc.d registrations keep working.
#   no sysvinit pkg   drops rc, rcS, halt, reboot, single, sendsigs,
#                     bootlogd, stop-bootlogd (busybox provides halt/reboot
#                     applets; init kills processes itself on shutdown).
#   no initscripts    drops the ~19 generic boot scripts (checkroot,
#                     mountall, bootmisc, populate-volatile, urandom, ...).
#                     Their few relevant jobs moved to the inittab: the
#                     initramfs already mounts/moves proc, sys and devtmpfs
#                     and the overlay root is born writable, so what remains
#                     is `mount -a` (fstab), the /var/volatile skeleton and
#                     the hostname — three sysinit lines.
require conf/distro/include/init-manager-sysvinit.inc
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_initscripts = ""

# Core distro features — explicit set so embedded image stays minimal.
# "sysvinit" is added by init-manager-sysvinit.inc above; do not remove it here.
#
# Dropped, each because the kernel no longer carries the matching support:
#   alsa    — CONFIG_SOUND is off; the board is headless with no codec.
#   nfs     — CONFIG_NFS_FS is off; nothing mounts an NFS share.
#   usbhost — the DTS pins dr_mode = "peripheral" and CONFIG_USB (host) is off.
DISTRO_FEATURES = "acl argp ext2 ipv4 ipv6 largefile usbgadget \
                   usrmerge sysvinit"

# Merged /usr (matches BR2_ROOTFS_MERGED_USR=y)
DISTRO_FEATURES:append = " usrmerge"

# Timezone (matches BR2_TARGET_LOCALTIME="Etc/UTC")
DEFAULT_TIMEZONE = "Etc/UTC"
DISTRO_FEATURES:append = " timezone"

# Size optimization (matches BR2_OPTIMIZE_2; -Os is slightly more aggressive).
# Keep oe-core's ${DEBUG_FLAGS} (the -f*-prefix-map set + -g): dropping it made
# every package's debug info embed absolute TMPDIR build paths, tripping the
# buildpaths QA across all -dbg/-staticdev packages. -Os replaces only -O2.
FULL_OPTIMIZATION = "-Os -pipe ${DEBUG_FLAGS}"
DEBUG_BUILD ?= "0"

# Locale whitelist (matches BR2_ENABLE_LOCALE_WHITELIST="C en_US en_US.utf8")
IMAGE_LINGUAS = "en-us"

# Hostname (matches BR2_TARGET_GENERIC_HOSTNAME="licheervnano")
hostname:pn-base-files = "licheervnano"

# Strip binaries
INHIBIT_PACKAGE_STRIP = "0"
PACKAGE_STRIP = "full"

# Lightweight package manager
PACKAGE_CLASSES = "package_ipk"

# No device manager at all. Every node this appliance touches comes from
# devtmpfs (mounted by the initramfs and moved into the root): there are no
# kernel modules to autoload (CONFIG_MODULES=n), no hotpluggable buses (USB is
# a gadget, not a host), and nothing consumes persistent /dev links. The one
# udev consumer (the zram-swap rule) became a plain init script.
VIRTUAL-RUNTIME_dev_manager = ""

# No syslogd/klogd: the NanoKVM server writes its own rotating log and the
# kernel ring buffer is available via dmesg. (This empties the
# packagegroup-core-boot RRECOMMENDS that pulled in busybox-syslog.)
VIRTUAL-RUNTIME_base-utils-syslog = ""

# packagegroup-core-boot hard-wires modutils-initscripts into its sysvinit
# script set; with CONFIG_MODULES=n there is nothing to modprobe, so override
# the list down to ${VIRTUAL-RUNTIME_initscripts} — which is empty above, so
# no generic init scripts are installed at all.
SYSVINIT_SCRIPTS:pn-packagegroup-core-boot = "${VIRTUAL-RUNTIME_initscripts}"

# Prefer libjpeg-turbo
PREFERRED_PROVIDER_jpeg = "libjpeg-turbo"

# With musl, libintl is provided by musl itself; forcing gettext as the
# provider causes a gettext → libxml2 → python3 → gettext circular dep.
# Disable Python bindings in libxml2 to break the cycle.
PACKAGECONFIG:remove:pn-libxml2 = "python"

# Disable SPDX generation — causes circular dependency loops with musl
INHERIT:remove = "create-spdx"

# buildpaths QA: the systemic cause (missing prefix-map) is fixed via
# FULL_OPTIMIZATION above. The former residual offenders (the closed sophgo-
# middleware libs and the out-of-tree osdrv cvitek kernel modules) have been
# removed from the build entirely, so the check is left enabled to surface any
# real regression.

# textrel QA waiver inherited from meta-riscv (now dropped from the layer
# set: oe-core provides the riscv64 tune and everything else in that layer
# was gated on other machines). util-linux is the only waiver that applies to
# this image's package set; a known upstream gcc/riscv64 artifact.
INSANE_SKIP:append:pn-util-linux:riscv64 = " textrel"
