# OpenIPMI lanserv configuration for the NanoKVM BMC simulator.
#
# This defines the LAN (RMCP+) interface ipmi_sim listens on and the
# users allowed to authenticate. See the lan.conf(5) man page from OpenIPMI.

name "nanokvm-bmc"

# Set the BMC management controller address.
set_working_mc 0x20

  # Listen for IPMI-over-LAN (RMCP/RMCP+) on the standard IPMI UDP port.
  startlan 1
    addr :: 623

    priv_limit admin

    # Authentication algorithms allowed at each privilege level.
    allowed_auths_callback none md2 md5 straight
    allowed_auths_user none md2 md5 straight
    allowed_auths_operator none md2 md5 straight
    allowed_auths_admin none md2 md5 straight

    # A unique GUID for this BMC.
    guid a123456789abcdefa123456789abcdef
  endlan

  # Where to bind for the serial/console interface (optional, disabled).
  # serial 15 /dev/ttyS1 115200 8n1

  # IPMI users. Format:
  #   user <num> <enabled> <username> <password> <max-priv> <allowed-auths>
  user 1 true  ""      "test"   user     none md2 md5 straight
  user 2 true  "admin" "admin"  admin    none md2 md5 straight
