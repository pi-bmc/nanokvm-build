# busybox udhcpd config for the BMC <-> managed-host USB gadget link (usb0).
# Started by /etc/network/if-up.d/nanokvm-usb0, stopped by the matching
# if-post-down.d hook. Redfish-Host-Interface-style: exactly one lease on the
# IPv4 link-local subnet, and deliberately NO router / dns / domain options --
# the host must install neither a default route nor a resolver via this link,
# so it can never try to reach the LAN (or the internet) through the BMC.
interface	usb0
start		169.254.10.2
end		169.254.10.2
max_leases	1
lease_file	/var/run/udhcpd-usb0.leases
pidfile		/var/run/udhcpd-usb0.pid
option	subnet	255.255.0.0
option	lease	3600
