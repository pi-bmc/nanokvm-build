# Boot menu for mainline U-Boot (distro boot / sysboot), read from
# /extlinux/extlinux.conf on the FAT boot partition.
#
# KERNEL and DEVICETREE name separate files in the partition root (paths are
# absolute from there). U-Boot loads the raw Image at ${kernel_addr_r} and the
# DTB at ${fdt_addr_r}, applies its ft_board_setup() fixups to the DTB -- this
# is where the eFUSE-derived local-mac-address lands -- and boots via `booti`,
# which relocates the kernel down to its 0x80200000 run address.
#
# This replaces the old single-file FIT (boot.sd). pxe_utils lowercases keywords
# before matching, so DEVICETREE == devicetree == fdt.
#
# TIMEOUT is in tenths of a second.
DEFAULT nanokvm
TIMEOUT 10

LABEL nanokvm
    KERNEL /Image
    INITRD /initramfs
    DEVICETREE /sg2002-licheerv-nano-b.dtb
    # No root=/rootwait: the initramfs (INITRD above) owns root assembly --
    # it waits for the SD card, picks a rootfs slot (p2/p3 squashfs, /slot
    # file with fallback), lays the volatile overlay and switch_roots.
    # net.ifnames=0 keeps kernel interface names (eth0) instead of udev
    # "predictable" names (enp*/en*), matching the interface name the NanoKVM
    # server's network config expects (network.eth0.name in server.yaml).
    #
    # loglevel=0 keeps the media drivers from taking the board down with their
    # own error reporting. They report back-pressure with pr_err, once per
    # dropped frame; at 60fps, on a 115200 serial console, each of those is a
    # synchronous in-kernel write on the only core there is, and the board
    # stops scheduling userspace altogether -- ping still answers, nothing else
    # does, and only a power cycle recovers it. Sipeed's own firmware boots
    # with loglevel=0 for what is presumably the same reason. Nothing is lost:
    # the messages still reach the ring buffer, so dmesg is unaffected, and
    # only the write to the serial line goes away. Raise it on the U-Boot
    # command line when debugging something that has to be seen live.
    APPEND console=ttyS0,115200 earlycon=sbi net.ifnames=0 loglevel=0
