# Boot menu for mainline U-Boot (distro boot / sysboot), read from
# /extlinux/extlinux.conf on the FAT boot partition. KERNEL points at the FIT
# image (boot.sd) in the partition root; U-Boot boots its default
# configuration (kernel + board DTB). TIMEOUT is in tenths of a second.
DEFAULT nanokvm
TIMEOUT 10

LABEL nanokvm
    KERNEL /boot.sd
    APPEND console=ttyS0,115200 earlycon=sbi root=/dev/mmcblk0p2 rootwait rw
