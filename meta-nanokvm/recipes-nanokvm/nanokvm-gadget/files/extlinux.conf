# Boot menu for mainline U-Boot (distro boot / sysboot), read from
# /extlinux/extlinux.conf on the FAT boot partition.
#
# KERNEL and DEVICETREE name separate files in the partition root (paths are
# absolute from there). U-Boot loads the raw Image at ${kernel_addr_r} and the
# DTB at ${fdt_addr_r}, applies its ft_board_setup() fixups to the DTB -- this
# is where the eFUSE-derived local-mac-address lands -- and boots via `booti`,
# which relocates the kernel down to its 0x80200000 run address.
#
# This replaces the old single-file FIT (boot.sd). pxe_utils lowercases keywords
# before matching, so DEVICETREE == devicetree == fdt.
#
# TIMEOUT is in tenths of a second.
DEFAULT nanokvm
TIMEOUT 10

LABEL nanokvm
    KERNEL /Image
    DEVICETREE /sg2002-licheerv-nano-b.dtb
    # net.ifnames=0 keeps kernel interface names (eth0) instead of udev
    # "predictable" names (enp*/en*), so nanokvm-network's eth0 config matches.
    APPEND console=ttyS0,115200 earlycon=sbi root=/dev/mmcblk0p2 rootwait rw net.ifnames=0
