#@TYPE: Machine
#@NAME: Sophgo SG2002 LicheeRV Nano
#@DESCRIPTION: Sophgo SG2002 RISC-V SoC on the Sipeed LicheeRV Nano board

require conf/machine/include/riscv/tune-riscv.inc

MACHINE_FEATURES = "ext2 ext3 serial vfat usbgadget usbhost"

# Kernel: mainline Linux 6.18 (upstream sophgo,sg2002 support). The vendor scpcom
# 5.10 BSP is retired; the closed multimedia/AI stack it carried is dropped.
PREFERRED_PROVIDER_virtual/kernel = "linux-sophgo"
PREFERRED_VERSION_linux-sophgo = "6.18%"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "sophgo/sg2002-licheerv-nano-b.dtb"

# Bootloader: mainline U-Boot (upstream LicheeRV Nano board; see
# doc/board/sophgo/licheerv_nano.rst). Boot chain: vendor FSBL (BL2, DDR init)
# -> mainline OpenSBI fw_dynamic -> mainline U-Boot -> extlinux.conf -> FIT
# (boot.sd), all but the FIT packed into fip.bin by the fsbl recipe.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "sipeed_licheerv_nano_defconfig"

# OpenSBI / FSBL: mainline generic-platform fw_dynamic. The board DTB is embedded
# via FW_FDT_PATH (opensbi_1.7.bb) because the FSBL enters OpenSBI with a1 pointing
# at an address where no DTB is loaded and the cv181x fiptool cannot add one; the
# generic platform needs an FDT for console/CLINT/PLIC.
PREFERRED_PROVIDER_virtual/opensbi = "opensbi"

# T-Head C906 RISC-V 64-bit (musl libc via distro config)
DEFAULTTUNE = "riscv64"

# The whole build (kernel, u-boot, fsbl, userspace) uses the standard OE cross
# GCC. The T-Head C906 vendor constructs in the FSBL are handled by mainline
# GCC >= 13's XThead scalar extensions (see recipes-bsp/fsbl); the vendored
# T-Head 10.2 toolchain and the closed multimedia stack that required it have
# been removed.

SERIAL_CONSOLES = "115200;ttyS0"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"

# SD card image via WKS
WKS_FILE = "nanokvm-sd.wks"
IMAGE_FSTYPES = "wic wic.xz"
IMAGE_BOOT_FILES = "fip.bin boot.sd"

MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"
