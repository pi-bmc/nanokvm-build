# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "pibmc"
BBFILE_PATTERN_pibmc = "^${LAYERDIR}/"
BBFILE_PRIORITY_pibmc = "10"

LAYERSERIES_COMPAT_pibmc = "scarthgap"

# talos-dtbs pulls DTBs out of an OCI image with crane; make the host
# binary visible inside bitbake's isolated build environment when present.
HOSTTOOLS_NONFATAL += "crane"
