#@TYPE: Machine
#@NAME: pi-bmc-rpi64
#@DESCRIPTION: Firmware-only machine producing a boot-partition SD image
# (U-Boot + TF-A armstubs + Raspberry Pi firmware) for Raspberry Pi 4/5.

require conf/machine/include/arm/armv8a/tune-cortexa72.inc

MACHINE_FEATURES = ""

# No OS is built for this machine - the image is only a boot partition.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-pibmc"
PREFERRED_PROVIDER_u-boot = "u-boot-pibmc"

UBOOT_MACHINE = "rpi_arm64_defconfig"

IMAGE_FSTYPES = "wic.xz"
WKS_FILE = "pi-bmc-boot.wks"

# Contents of the FAT32 EFI partition, assembled by wic's bootimg-partition
# plugin from DEPLOY_DIR_IMAGE. Entries without a destination land in the
# partition root; later entries overwrite earlier ones (custom overlays
# replace the stock firmware ones).
IMAGE_BOOT_FILES = " \
    u-boot.bin;kernel8.img \
    armstub8.bin \
    armstub8-2712.bin \
    config.txt \
    rpi-firmware/*.elf \
    rpi-firmware/*.dat \
    rpi-firmware/*.bin \
    rpi-firmware/overlays/*;overlays/ \
    pibmc-overlays/*;overlays/ \
    talos-dtbs/*.dtb \
    talos-dtbs/*.dtb;broadcom/ \
"
