name: Yocto CI Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  yocto-build:
    # Strongly recommended to use your own powerful hardware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential git bison flex bc libssl-dev libgnutls28-dev device-tree-compiler kas chrpath diffstat
          version: 1.0

      - name: Disable AppArmor unprivileged user namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Create Cache and Download Directories
        run: |
          mkdir -p ${{ github.workspace }}/build/downloads
          mkdir -p ${{ github.workspace }}/build/sstate-cache

      - name: Run kas Build
        run: |
          kas build kas.yml
        env:
          # Pass cache paths into your BitBake configuration variables via kas
          KAS_DL_DIR: ${{ github.workspace }}/build/downloads
          KAS_SSTATE_DIR: ${{ github.workspace }}/build/sstate-cache
